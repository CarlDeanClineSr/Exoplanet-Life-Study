<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760">
<rect width="1400" height="760" fill="white"/>
<text x="70" y="42" font-family="Arial, sans-serif" font-size="28" font-weight="700">Earth atmospheric examination: representative molecular bands</text>
<text x="70" y="72" font-family="Arial, sans-serif" font-size="16">Teaching map — band positions are representative landmarks, not a modeled spectrum or detectability forecast.</text>

<!-- axis -->
<line x1="100" y1="660" x2="1320" y2="660" stroke="#222" stroke-width="2"/>
<g font-family="Arial, sans-serif" font-size="14" fill="#222">
  <text x="95" y="690">0.6</text>
  <text x="300" y="690">5</text>
  <text x="510" y="690">10</text>
  <text x="720" y="690">15</text>
  <text x="930" y="690">20</text>
  <text x="1135" y="690">25</text>
  <text x="1300" y="690">28</text>
  <text x="625" y="730" font-size="18">Wavelength (microns)</text>
</g>

<!-- instrument bands -->
<rect x="100" y="95" width="205" height="36" fill="#eeeeee" stroke="#333"/>
<text x="115" y="119" font-family="Arial, sans-serif" font-size="16">NIRSpec: 0.6–5.3 µm</text>
<rect x="286" y="95" width="104" height="36" fill="#dddddd" stroke="#333"/>
<text x="296" y="119" font-family="Arial, sans-serif" font-size="14">MIRI: 4.9–27.9 µm</text>

<!-- bands positioned on an approximately linear teaching axis: x = 100 + (lambda-0.6)/(27.4)*1220 -->
<g font-family="Arial, sans-serif" font-size="13">
<!-- O2 -->
<line x1="101" y1="180" x2="101" y2="640" stroke="#333" stroke-width="2"/>
<text x="108" y="180">O₂ 0.63</text>
<line x1="104" y1="220" x2="104" y2="640" stroke="#333" stroke-width="2"/>
<text x="111" y="220">O₂ 0.69</text>
<line x1="107" y1="260" x2="107" y2="640" stroke="#333" stroke-width="2"/>
<text x="114" y="260">O₂ 0.76</text>
<line x1="120" y1="300" x2="120" y2="640" stroke="#333" stroke-width="2"/>
<text x="127" y="300">O₄ 1.06</text>
<line x1="130" y1="340" x2="130" y2="640" stroke="#333" stroke-width="2"/>
<text x="137" y="340">O₂/O₄ 1.27</text>

<!-- NIR molecules -->
<line x1="115" y1="390" x2="115" y2="640" stroke="#777"/>
<text x="115" y="410">H₂O ~0.94</text>
<line x1="136" y1="430" x2="136" y2="640" stroke="#777"/>
<text x="136" y="450">H₂O ~1.4</text>
<line x1="159" y1="470" x2="159" y2="640" stroke="#777"/>
<text x="159" y="490">H₂O ~1.9</text>
<line x1="194" y1="510" x2="194" y2="640" stroke="#777"/>
<text x="194" y="530">H₂O/CO₂ ~2.7</text>
<line x1="220" y1="550" x2="220" y2="640" stroke="#555"/>
<text x="220" y="570">CH₄ ~3.3</text>
<line x1="274" y1="590" x2="274" y2="640" stroke="#555"/>
<text x="274" y="610">CO ~4.7</text>
<line x1="274" y1="250" x2="274" y2="640" stroke="#333"/>
<text x="282" y="250">CO₂ ~4.3</text>

<!-- MIR molecules -->
<line x1="354" y1="180" x2="354" y2="640" stroke="#555"/>
<text x="360" y="180">H₂O ~6.3</text>
<line x1="345" y1="220" x2="345" y2="640" stroke="#777"/>
<text x="350" y="220">NO₂ ~6.1</text>
<line x1="416" y1="270" x2="416" y2="640" stroke="#555"/>
<text x="422" y="270">CH₄/N₂O ~7.7</text>
<line x1="404" y1="320" x2="404" y2="640" stroke="#777"/>
<text x="410" y="320">HNO₃ ~7.5</text>
<line x1="501" y1="370" x2="501" y2="640" stroke="#333" stroke-width="2"/>
<text x="507" y="370">O₃ ~9.6</text>
<line x1="575" y1="420" x2="575" y2="640" stroke="#333" stroke-width="2"/>
<text x="581" y="420">HNO₃ ~11.3</text>
<line x1="742" y1="470" x2="742" y2="640" stroke="#333" stroke-width="2"/>
<text x="748" y="470">CO₂ ~15</text>
</g>

<!-- legend -->
<text x="70" y="105" font-family="Arial, sans-serif" font-size="14" font-weight="700">JWST coverage</text>
<text x="70" y="625" font-family="Arial, sans-serif" font-size="16">The map shows where molecules have important bands; it does not claim JWST can detect every band in every target.</text>
</svg>